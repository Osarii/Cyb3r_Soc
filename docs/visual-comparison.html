<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyb3r_Soc · Comparación visual</title>
<style>body{margin:0;background:#090711;color:#f1eafa;font:15px/1.5 system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid #4b325e}h1{margin:0;font-size:25px}p{color:#b9adc9}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{background:#241437;border:1px solid #775193;color:#eee;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#623096;border-color:#c395ef}main{padding:20px 32px}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.stage{position:relative;width:100%;aspect-ratio:1672/941;border:1px solid #574066;margin-top:16px;background:#070710}.stage img{position:absolute;inset:0;width:100%;height:100%}.actual{clip-path:inset(0 50% 0 0)}.divider{position:absolute;top:0;bottom:0;left:50%;border-left:2px solid #ddbdff;pointer-events:none}label{display:flex;gap:12px;align-items:center}input{width:260px}small{color:#bba9cf}</style></head>
<body><header><h1>Cyb3r_Soc · Referencia y render actual</h1><p>Desliza el control: implementación a la izquierda, referencia a la derecha. Las referencias conservan el nombre anterior; el producto usa Cyb3r_Soc.</p><nav id="screens"></nav></header>
<main><div class="controls"><label>Implementación visible <input id="amount" type="range" min="0" max="100" value="50"><output id="value">50%</output></label><button id="reference">Solo referencia</button><button id="current">Solo implementación</button><small>Capturas de navegador: 1672 × 941</small></div><div class="stage"><img id="target" alt="Referencia original"><img id="actual" class="actual" alt="Implementación actual"><div class="divider"></div></div></main>
<script>const entries=[['01-dashboard','Dashboard'],['02-boot-screen','Boot'],['03-threat-map','Mapa'],['04-ddos-mitigation','Mitigación'],['05-server-offline','Offline']];const nav=document.querySelector('#screens');function select(file){document.querySelector('#target').src='references/'+file+'.png';document.querySelector('#actual').src='visual-current/'+file+'.png';nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.file===file))}entries.forEach(([file,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.file=file;b.onclick=()=>select(file);nav.appendChild(b)});const slider=document.querySelector('#amount');function update(n){slider.value=n;document.querySelector('#value').textContent=n+'%';document.querySelector('#actual').style.clipPath='inset(0 '+(100-n)+'% 0 0)';document.querySelector('.divider').style.left=n+'%'}slider.oninput=()=>update(slider.value);document.querySelector('#reference').onclick=()=>update(0);document.querySelector('#current').onclick=()=>update(100);select(entries[0][0]);</script></body></html>
